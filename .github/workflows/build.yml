name: Bedrock 1.26.51.1 client build
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: bsc-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  format-tests:
    name: JSON model-library schema self-test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python validators
        run: python -m py_compile tools/verify_model_library.py tools/verify_package.py
      - name: Validate atlas variant/mesh index invariants
        run: python tools/verify_model_library.py --self-test
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22
      - name: Restore xmake dependency cache
        id: xmake-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/.xmake
          key: bsc-26.51-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            bsc-26.51-${{ runner.os }}-
      - name: Update package repositories
        run: xmake repo -u
      - name: Configure
        run: xmake f -a x64 -p windows -m release -y -v
      - name: Compile
        shell: pwsh
        run: |
          & xmake -y -v -D *>&1 | Tee-Object -FilePath build-client.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload compiler diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: BedrockSceneCapture-build-diagnostics
          if-no-files-found: ignore
          path: build-client.log
      - name: Verify packaged client manifest and DLL
        run: python tools/verify_package.py
      - name: Validate model library schema self-test
        run: python tools/verify_model_library.py --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockSceneCapture-1.26.51.1-windows-x64
          if-no-files-found: error
          path: |
            bin/BedrockSceneCapture/
            !bin/**/*.pdb
      - name: Save xmake dependencies even if compilation fails
        if: ${{ always() && steps.xmake-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/.xmake
          key: bsc-26.51-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
